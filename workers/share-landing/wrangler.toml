# 배포: cd workers/share-landing && npx wrangler deploy
# 최초 1회: npx wrangler login  (브라우저로 Cloudflare 로그인)
#
# SUPABASE_URL은 비밀이 아니다(공개 프로젝트 URL). 그래도 코드에 박지 않고 var로 둔다.
name = "milkyway-share-landing"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[vars]
SUPABASE_URL = "https://hyjgfgzexvxhgfmqgiqu.supabase.co"

# 도메인 전체를 워커가 받는다. /s/{code}는 랜딩, 나머지는 안내 페이지.
# (경로를 /s/*로 좁히면 나머지 경로가 DNS 플레이스홀더(100::)로 빠져 에러가 난다)
[[routes]]
pattern = "mymilkyway.xyz/*"
zone_name = "mymilkyway.xyz"
