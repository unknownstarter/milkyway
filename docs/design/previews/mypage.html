<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#181818;--surface:#1F1F1F;--white:#FFFFFF;--txt:#ECECEC;--sec:#838383;--ter:#646464;--accent:#48FF00;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{background:#000;font-family:var(--sans);}
  .phone{width:390px;background:var(--bg);color:var(--txt);position:relative;overflow:hidden;}
  .hdr{height:60px;display:flex;align-items:center;padding:0 20px;}
  .hdr .t{font-size:24px;font-weight:700;color:var(--white);letter-spacing:-.6px;}
  /* 프로필 */
  .profile{display:flex;align-items:center;gap:16px;padding:10px 20px 0;}
  .profile .av{width:60px;height:60px;border-radius:50%;flex:0 0 auto;background:linear-gradient(140deg,#2c2c2c,#1e1e1e);
    border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--sec);font-weight:700;}
  .profile .nm{font-size:19px;font-weight:700;color:var(--white);letter-spacing:-.3px;}
  .profile .edit{font-size:13px;color:var(--sec);margin-top:5px;display:inline-flex;align-items:center;gap:4px;}
  .profile .edit svg{width:13px;height:13px;stroke:var(--sec);stroke-width:1.8;fill:none;}
  /* 나의 별자리 요약 (나의 여정, 경쟁 아님) */
  .stats{margin:24px 20px 0;background:var(--surface);border:1px solid #262626;border-radius:16px;padding:20px 18px;position:relative;overflow:hidden;}
  .stats::before{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle,rgba(72,255,0,.08),transparent 70%);}
  .stats .lab{font-size:12px;font-weight:600;color:var(--sec);letter-spacing:.2px;}
  .stats .row{display:flex;margin-top:16px;}
  .stats .col{flex:1;}
  .stats .col .n{font-size:26px;font-weight:800;color:var(--white);letter-spacing:-.5px;line-height:1;}
  .stats .col .n .star{color:var(--accent);}
  .stats .col .c{font-size:12.5px;color:var(--sec);margin-top:8px;}
  /* 메뉴 그룹 */
  .group{margin:24px 20px 0;background:var(--surface);border:1px solid #262626;border-radius:16px;overflow:hidden;}
  .rw{display:flex;align-items:center;gap:14px;padding:16px;border-top:1px solid #262626;}
  .rw:first-child{border-top:none;}
  .rw svg{width:20px;height:20px;stroke:var(--sec);stroke-width:1.7;fill:none;flex:0 0 auto;}
  .rw .l{font-size:15px;color:var(--txt);letter-spacing:-.2px;}
  .rw .ch{margin-left:auto;color:var(--ter);font-size:19px;}
  .rw .badge{margin-left:auto;font-size:11px;font-weight:700;color:#000;background:var(--accent);border-radius:999px;padding:2px 8px;}
  .foot{text-align:center;font-size:12px;color:var(--ter);margin-top:22px;}
  .foot .link{margin:0 10px;}
  /* 탭 */
  .tabbar{margin-top:30px;height:80px;display:flex;align-items:flex-start;justify-content:space-around;padding-top:12px;
    border-top:1px solid #262626;position:relative;background:var(--bg);}
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--ter);}
  .tab.on{color:var(--white);}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;}
</style></head>
<body><div class="phone">
  <div class="hdr"><span class="t">나</span></div>

  <div class="profile">
    <div class="av">노아</div>
    <div>
      <div class="nm">노아</div>
      <div class="edit"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/></svg>프로필 편집</div>
    </div>
  </div>

  <!-- 나의 별자리 요약 -->
  <div class="stats">
    <div class="lab">내 기록</div>
    <div class="row">
      <div class="col"><div class="n">24</div><div class="c">담은 책</div></div>
      <div class="col"><div class="n">41</div><div class="c">남긴 메모</div></div>
      <div class="col"><div class="n">8</div><div class="c">완독한 책</div></div>
    </div>
  </div>

  <!-- 메뉴 -->
  <div class="group">
    <div class="rw"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="l">알림 설정</span><span class="ch">›</span></div>
    <div class="rw"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="l">의견 보내기</span><span class="ch">›</span></div>
    <div class="rw"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span class="l">공지사항</span><span class="badge">N</span></div>
  </div>

  <div class="group">
    <div class="rw"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span class="l">로그아웃</span><span class="ch">›</span></div>
  </div>

  <div class="foot"><span class="link">이용약관</span><span class="link">개인정보</span><span class="link">버전 0.1.1</span></div>

  <div class="tabbar">
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>홈</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 0-2 2z"/><path d="M6 20a2 2 0 0 1 2-2h11"/></svg>책</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>메모</div>
    <div class="tab on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>나</div>
  </div>
</div></body></html>
