<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#181818;--surface:#1F1F1F;--white:#FFFFFF;--txt:#ECECEC;--sec:#838383;--ter:#646464;--accent:#48FF00;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{background:#000;font-family:var(--sans);}
  .phone{width:390px;height:844px;background:var(--bg);color:var(--txt);position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .hdr{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:0 0 auto;}
  .hdr .cancel{font-size:15px;color:var(--sec);}
  .hdr .t{font-size:16px;font-weight:600;color:var(--white);}
  .hdr .save{font-size:15px;font-weight:700;color:var(--ter);}
  .ctx{padding:6px 20px 0;}
  .ctx .book{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--txt);background:var(--surface);
    border:1px solid #2a2a2a;border-radius:999px;padding:7px 13px;letter-spacing:-.2px;}
  .ctx .book .cv{width:14px;height:20px;border-radius:3px;background:linear-gradient(155deg,#2f5148,#152a24);}
  .editor{flex:1;padding:22px 20px 0;overflow:hidden;}
  .editor .ph{font-size:17px;line-height:1.7;color:var(--ter);letter-spacing:-.2px;word-break:keep-all;}
  .editor .caret{display:inline-block;width:2px;height:20px;background:var(--accent);vertical-align:-3px;}
  .tool{flex:0 0 auto;border-top:1px solid #262626;padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;}
  .tool .pg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sec);}
  .tool .pg .n{color:var(--ter);font-weight:600;}
  .tool .ic{width:22px;height:22px;stroke:var(--sec);stroke-width:1.7;fill:none;}
  .tool .vis{margin-left:auto;display:flex;gap:6px;background:#161616;border-radius:999px;padding:3px;}
  .tool .vis .o{font-size:12.5px;font-weight:600;color:var(--sec);padding:7px 13px;border-radius:999px;}
  .tool .vis .o.on{background:var(--accent);color:#000;}
</style></head>
<body><div class="phone">
  <div class="hdr"><span class="cancel">취소</span><span class="t">메모</span><span class="save">저장</span></div>

  <div class="ctx"><span class="book"><span class="cv"></span>물고기는 존재하지 않는다</span></div>

  <div class="editor">
    <div class="ph">오늘 읽은 문장, 그 문장이 남긴 생각을 적어보세요<span class="caret"></span></div>
  </div>

  <div class="tool">
    <div class="pg">p <span class="n">쪽</span></div>
    <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>
    <div class="vis"><span class="o on">공개</span><span class="o">나만 보기</span></div>
  </div>
</div></body></html>
