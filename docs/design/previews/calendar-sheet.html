<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#181818;--surface:#1F1F1F;--sheet:#222;--white:#FFFFFF;--txt:#ECECEC;--sec:#838383;--ter:#646464;--accent:#48FF00;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{background:#000;font-family:var(--sans);}
  .phone{width:390px;height:844px;background:var(--bg);color:var(--txt);position:relative;overflow:hidden;}
  /* 딤 처리된 캘린더 배경 암시 */
  .scrim{position:absolute;inset:0;background:rgba(10,10,10,.6);}
  .bgcal{position:absolute;top:0;left:0;right:0;padding:60px 20px 0;opacity:.25;filter:blur(1px);}
  .bgcal .row{display:flex;justify-content:space-between;margin-bottom:22px;}
  .bgcal .n{font-size:14px;color:#888;width:26px;text-align:center;}
  /* 바텀시트 */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:24px 24px 0 0;
    padding:12px 0 calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.5);}
  .handle{width:40px;height:4px;border-radius:2px;background:#444;margin:0 auto 16px;}
  .shead{display:flex;align-items:baseline;justify-content:space-between;padding:0 22px 4px;}
  .shead .d{font-size:19px;font-weight:700;color:var(--white);letter-spacing:-.3px;}
  .shead .c{font-size:13px;color:var(--sec);font-weight:500;}
  .list{padding:12px 0 0;}
  .item{padding:16px 22px;border-top:1px solid #2c2c2c;display:flex;gap:14px;align-items:flex-start;}
  .item:first-child{border-top:none;}
  .item .body{flex:1;min-width:0;}
  .item .q{font-size:15px;line-height:1.55;color:var(--txt);letter-spacing:-.2px;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .item .m{font-size:12px;color:var(--ter);margin-top:8px;}
  .item .cv{width:34px;height:50px;border-radius:5px;flex:0 0 auto;}
  .item .ch{color:var(--ter);font-size:20px;align-self:center;}
  .g3{background:linear-gradient(155deg,#2f5148,#152a24);} .g5{background:linear-gradient(155deg,#4a3560,#1e1528);}
</style></head>
<body><div class="phone">
  <div class="bgcal">
    <div class="row"><span class="n">일</span><span class="n">월</span><span class="n">화</span><span class="n">수</span><span class="n">목</span><span class="n">금</span><span class="n">토</span></div>
    <div class="row"><span class="n">10</span><span class="n">11</span><span class="n">12</span><span class="n">13</span><span class="n">14</span><span class="n" style="color:#48FF00">15</span><span class="n">16</span></div>
    <div class="row"><span class="n">17</span><span class="n">18</span><span class="n">19</span><span class="n">20</span><span class="n">21</span><span class="n">22</span><span class="n">23</span></div>
  </div>
  <div class="scrim"></div>

  <div class="sheet">
    <div class="handle"></div>
    <div class="shead"><span class="d">8월 15일 목요일</span><span class="c">메모 3</span></div>
    <div class="list">
      <div class="item">
        <div class="body">
          <div class="q">분류는 내가 세상을 이해하는 방식이라 믿었는데, 오늘 보니 무너지지 않으려고 세워둔 벽에 가까웠다</div>
          <div class="m">물고기는 존재하지 않는다 / p88</div>
        </div>
        <div class="cv g3"></div>
      </div>
      <div class="item">
        <div class="body">
          <div class="q">기억은 과거를 그대로 저장하지 않는다. 우리는 떠올릴 때마다 그것을 다시 쓴다</div>
          <div class="m">물고기는 존재하지 않는다 / p142</div>
        </div>
        <div class="cv g3"></div>
      </div>
      <div class="item">
        <div class="body">
          <div class="q">슬픔은 결국, 타인의 고통에 대한 상상력이다</div>
          <div class="m">슬픔을 공부하는 슬픔 / p57</div>
        </div>
        <div class="cv g5"></div>
      </div>
    </div>
  </div>
</div></body></html>
