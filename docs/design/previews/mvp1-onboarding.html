<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#181818;--surface:#1F1F1F;--white:#FFFFFF;--txt:#ECECEC;--sec:#838383;--ter:#646464;--accent:#48FF00;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{background:#000;font-family:var(--sans);}
  .phone{width:390px;background:var(--bg);color:var(--txt);position:relative;overflow:hidden;display:flex;flex-direction:column;}
  /* 상단 진행 */
  .top{padding:16px 20px 0;display:flex;align-items:center;gap:6px;}
  .top .dot{height:3px;border-radius:2px;background:#333;flex:1;}
  .top .dot.on{background:var(--accent);}
  .skip{margin-left:auto;font-size:13px;color:var(--sec);font-weight:500;flex:0 0 auto;padding-left:10px;}
  /* 헤드 카피 */
  .head{padding:32px 20px 0;}
  .head h1{font-size:24px;font-weight:700;color:var(--white);line-height:1.35;letter-spacing:-.4px;}
  .head p{font-size:15px;color:var(--sec);margin-top:10px;line-height:1.5;}
  /* 책 그리드 3열 */
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:26px 20px 0;}
  .bk{position:relative;}
  .bk .cv{width:100%;aspect-ratio:2/3;border-radius:8px;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  .bk .cv .t{position:absolute;left:8px;right:8px;top:10px;font-size:11px;font-weight:700;line-height:1.3;color:#EDEDED;letter-spacing:-.2px;}
  .bk .cv .a{position:absolute;left:8px;right:8px;bottom:9px;font-size:9px;color:rgba(255,255,255,.5);}
  .bk .nm{font-size:11px;color:var(--txt);font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk .add{font-size:10.5px;color:var(--ter);margin-top:2px;}
  /* 선택 상태 */
  .bk.sel .cv{outline:2px solid var(--accent);outline-offset:2px;}
  .bk .chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);
    display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .bk.sel .chk{display:flex;}
  .bk .chk svg{width:13px;height:13px;stroke:#000;stroke-width:3;fill:none;}
  .bk.sel .nm{color:var(--accent);}
  /* 하단 CTA */
  .spacer{flex:1;min-height:24px;}
  .cta-wrap{padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);}
  .cta{height:54px;border-radius:14px;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;letter-spacing:-.2px;}
  .g1{background:linear-gradient(155deg,#3a4a6b,#1b2030);} .g2{background:linear-gradient(155deg,#5b3a44,#251519);}
  .g3{background:linear-gradient(155deg,#2f5148,#152a24);} .g4{background:linear-gradient(155deg,#544a2c,#251f12);}
  .g5{background:linear-gradient(155deg,#4a3560,#1e1528);} .g6{background:linear-gradient(155deg,#63483a,#241812);}
</style></head>
<body><div class="phone">

  <div class="top">
    <div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div>
    <div class="skip">다음에 담기</div>
  </div>

  <div class="head">
    <h1>다른 은하들이<br>이런 책을 읽고 있어요</h1>
    <p>마음이 가는 책을 서재에 담으면<br>밤하늘이 조금 덜 비어 보여요.</p>
  </div>

  <div class="grid">
    <div class="bk sel"><div class="cv g1"><div class="t">우리가 빛의 속도로 갈 수 없다면</div><div class="a">김초엽</div></div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div class="nm">우리가 빛의 속도로…</div><div class="add">담김</div></div>
    <div class="bk sel"><div class="cv g2"><div class="t">아주 희미한 빛으로도</div><div class="a">최은영</div></div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div class="nm">아주 희미한 빛으로도</div><div class="add">담김</div></div>
    <div class="bk"><div class="cv g3"><div class="t">물고기는 존재하지 않는다</div><div class="a">룰루 밀러</div></div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div class="nm">물고기는 존재하지…</div><div class="add">312명의 은하</div></div>
    <div class="bk sel"><div class="cv g5"><div class="t">이토록 평범한 미래</div><div class="a">김연수</div></div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div class="nm">이토록 평범한 미래</div><div class="add">담김</div></div>
    <div class="bk"><div class="cv g4"><div class="t">시대예보</div><div class="a">송길영</div></div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div class="nm">시대예보</div><div class="add">128명의 은하</div></div>
    <div class="bk"><div class="cv g6"><div class="t">급류</div><div class="a">정대건</div></div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div class="nm">급류</div><div class="add">64명의 은하</div></div>
  </div>

  <div class="spacer"></div>
  <div class="cta-wrap"><div class="cta">3권 담고 시작하기</div></div>

</div></body></html>
