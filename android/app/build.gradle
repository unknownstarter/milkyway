plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: 'com.google.gms.google-services'  // Firebase 플러그인 추가

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('app/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 릴리즈 빌드인데 서명 키가 없으면 서명 없는 aab 가 조용히 만들어진다 (2026-11-02 0.2.17 사고).
// key.properties 와 upload-keystore.jks 는 gitignore 라 git worktree 에는 없다.
// debug 빌드, flutter test, analyze, CI 는 릴리즈 태스크를 요청하지 않으므로 영향 없다.
def releaseRequested = gradle.startParameter.taskNames.any {
    it ==~ /(?i).*(bundle|assemble|package)Release.*/
}
if (releaseRequested && !keystorePropertiesFile.exists()) {
    throw new GradleException(
        "\n[릴리즈 빌드 중단] android/app/key.properties 와 android/app/upload-keystore.jks 가 없습니다.\n" +
        "서명 없이 빌드하면 Play 가 aab 를 거절합니다. git worktree 에는 이 파일이 없으니 메인 체크아웃(~/milkyway)에서 두 파일을 복사해 오세요. (커밋 금지)"
    )
}

android {
    namespace = "com.whatif.milkyway"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true // flutter_local_notifications 요구사항
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.whatif.milkyway.android"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion flutter.minSdkVersion  // Firebase 요구사항
        targetSdkVersion flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            // ABI 분할은 App Bundle(AAB)이 Play에서 자동 처리한다. 수동 splits.abi +
            // universalApk 는 flutter build apk 시 per-ABI/universal APK를 같은 versionCode로
            // 만들어 Play에서 "더 높은 versionCode로 대체됨" 경고를 유발 -> 제거. 배포는 AAB로.
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    // AndroidX Core for WindowCompat (Edge-to-Edge support)
    implementation 'androidx.core:core-ktx:1.13.1'
    // Core library desugaring (flutter_local_notifications 요구사항)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
